<form action="/predict" method="POST" onsubmit="return validateForm()">

    <label>Gender</label>
    <select name="gender" required>
        <option value="0">Female</option>
        <option value="1">Male</option>
        <option value="2">Other</option>
    </select>

    <label>Age</label>
    <input type="number" id="age" name="age" required>

    <label>Hypertension</label>
    <select name="hypertension" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>

    <label>Heart Disease</label>
    <select name="heart_disease" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>

    <label>Smoking History</label>
    <select name="smoking_history" required>
        <option value="0">Never</option>
        <option value="1">No Info</option>
        <option value="2">Current</option>
        <option value="3">Former</option>
        <option value="4">Ever</option>
        <option value="5">Not Current</option>
    </select>

    <label>BMI</label>
    <input type="number" id="bmi" name="bmi" step="0.1" required>

    <label>HbA1c Level</label>
    <input type="number" id="hba1c" name="hba1c" step="0.1" required>

    <label>Blood Glucose Level</label>
    <input type="number" id="glucose" name="glucose" required>

    <button type="submit">Predict Diabetes</button>

</form>

<script src="{{ url_for('static', filename='script.js') }}"></script>
